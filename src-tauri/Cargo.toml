[package]
name = "bass-clef-trainer"
version = "0.1.0"
edition = "2021"
description = "低音谱号与钢琴键位记忆训练器（Tauri 桌面应用壳）"

[lib]
name = "bass_clef_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
bass-clef-core = { path = "../core" }
