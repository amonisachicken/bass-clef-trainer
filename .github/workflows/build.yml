# 三平台自动打包（macOS / Windows / Linux）
#
# 触发方式：
#   1. 推送形如 v0.1.0 的 Git 标签  → 自动打包并创建 GitHub Release
#   2. 手动：Actions 页面点击 "Run workflow"
#
# 产物（Release 附件）：
#   - macOS   : BassClefTrainer_*.dmg（Universal，Intel + Apple Silicon）
#   - Windows : *-setup.exe（NSIS 安装包）、*.msi
#   - Linux   : *.deb、*.AppImage

name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: --bundles msi,nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --include=dev

      - name: Tauri 打包
        run: npx tauri build ${{ matrix.args }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    # 显式授予写权限：即使仓库默认 Actions 权限是只读，这里也能创建 Release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          TAG="v$VERSION"
          FILES=$(find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" \) ! -name "*.sig" ! -name "*.zip")

          # 生成变更日志：自上一个标签以来的全部提交
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --oneline --no-merges "$PREV_TAG"..HEAD | sed 's/^/- /')
          else
            LOG=$(git log --oneline --no-merges -15 HEAD | sed 's/^/- /')
          fi
          NOTES="## 📦 $TAG 更新内容

          $LOG

          > 自动构建的三平台安装包（$(date -u +%Y-%m-%d)）
          > macOS（Universal dmg）· Windows（NSIS / MSI）· Linux（deb / AppImage）
          "

          echo "==> 标签: $TAG"
          echo "==> 上传文件:"
          echo "$FILES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "低音谱号训练器 $TAG" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --json name,url,assets --jq '"Release: \(.name)\nURL: \(.url)\n资产: \([.assets[].name] | join(", "))"'
